services:
  caddy:
    image: caddy:2
    container_name: fikir_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: .
      target: frontend
    container_name: fikir_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.yourdomain.com
    expose:
      - "3000"

  backend:
    build:
      context: .
      target: backend
    container_name: fikir_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ORIGIN: https://app.yourdomain.com
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: fikir_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fikir
      POSTGRES_USER: fikir
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fikir_dev_password}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - fikir_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fikir -d fikir"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fikir_postgres_data:
  caddy_data:
  caddy_config:
